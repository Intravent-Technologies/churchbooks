<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — ChurchBooks AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-login-body {
            background: var(--bg-subtle);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-login-card {
            background: var(--bg-elevated);
            padding: 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .admin-login-card h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .admin-login-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }
    </style>
</head>
<body class="admin-login-body">
    <div class="admin-login-card">
        <div style="margin-bottom: 24px;">
            <span style="font-size: 32px;">🔐</span>
        </div>
        <h1>Admin Access</h1>
        <p>ChurchBooks AI — Internal Dashboard</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" style="margin-bottom: 16px;">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/admin">
            <div class="form-group">
                <label for="password" style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; text-align: left;">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter admin password"
                       style="width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; font-family: 'Inter', sans-serif;">
            </div>
            <button type="submit" class="btn primary full-width large" style="margin-top: 16px;">Log In</button>
        </form>
    </div>
</body>
</html>
